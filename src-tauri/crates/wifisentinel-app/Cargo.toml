[package]
name = "wifisentinel-app"
version.workspace = true
edition.workspace = true
authors.workspace = true

[[bin]]
name = "wifisentinel-app"
path = "src/main.rs"

[build-dependencies]
tauri-build.workspace = true

[dependencies]
wifisentinel-core = { path = "../wifisentinel-core" }
wifisentinel-wlan = { path = "../wifisentinel-wlan" }
wifisentinel-capture = { path = "../wifisentinel-capture", features = ["npcap"] }
wifisentinel-detection = { path = "../wifisentinel-detection" }
wifisentinel-analysis = { path = "../wifisentinel-analysis" }
wifisentinel-pcap-analysis = { path = "../wifisentinel-pcap-analysis" }
wifisentinel-reporting = { path = "../wifisentinel-reporting" }
tauri.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
futures.workspace = true
sqlx.workspace = true

[dev-dependencies]
tokio = { version = "1", features = ["test-util", "full"] }
